services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: localdevpass
      POSTGRES_DB: salesdb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d salesdb"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - sales_pgdata:/var/lib/postgresql/data
volumes:
  sales_pgdata:
